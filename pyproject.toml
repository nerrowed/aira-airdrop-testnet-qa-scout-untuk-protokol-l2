[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aira-airdrop-testnet-qa-scout-untuk-protokol-l2"
version = "0.1.0"
description = 'Airdrop/Testnet QA Scout untuk protokol L2/DeFi resmi'
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ['evm', 'security', 'calldata', 'firewall', 'python']
dependencies = []

[project.scripts]
evm-firewall = "aira_airdrop_testnet_qa_scout_untuk_protokol_l2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
